[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amas"
version = "0.1.0"
description = "AI Model Attack Simulator - automated red-teaming of LLM and agent endpoints"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AMAS contributors" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "jailbreak", "pentest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
amas = "amas.cli:main"

[tool.setuptools.packages.find]
include = ["amas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"